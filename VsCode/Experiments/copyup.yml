apiVersion: v1
kind: Pod
metadata:
  name: copyup-test-pod
spec:
  restartPolicy: Never
  containers:
  - name: copyup-container
    image: radiocat2000/whiteoutalphine:v1
    imagePullPolicy: Always

    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Container started. Waiting 30s...";
        sleep 30;

        echo "Starting copy-up workload (modifications)...";

        for i in $(seq 1 10000); do
          echo "y" >> file_$i   # append → forces copy-up
          sleep 0.01
        done

        echo "Modification done. Sleeping for observation...";
        sleep 300;

    securityContext:
      privileged: true