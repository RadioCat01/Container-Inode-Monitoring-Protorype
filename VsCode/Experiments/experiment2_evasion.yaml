apiVersion: v1
kind: Pod
metadata:
  name: exp2-evasion-test
  namespace: default
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Waking up cgroup discovery..."
      touch /tmp/warmup
      echo "Waiting 60s for kernel whitelisting..." 
      sleep 60
      echo "Running Evasion research payload (instant create/delete)..."
      mkdir -p /tmp/evasion
      for i in $(seq 1 10000); do
        touch /tmp/evasion/evil_$i
        rm /tmp/evasion/evil_$i
      done
      echo "Done! Keeping pod alive for metrics collection."
      sleep 3600
