apiVersion: v1
kind: Pod
metadata:
  name: exp1-whiteout-testxx
  namespace: default
spec:
  containers:
  - name: ubuntu
    image: ubuntu:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Waking up cgroup discovery..."
      touch /tmp/warmup
      echo "Waiting 60s for kernel whitelisting..." 
      sleep 60
      echo "Running Whiteout research payload (deleting base files)..."

      ls /usr/share | head -n 20000 | xargs -I {} rm -rf /usr/share/{}
      ls /usr/bin | grep -v "^rm$" | head -n 5000 | xargs -I {} rm /usr/bin/{}

      echo "Done! Keeping pod alive for metrics collection."
      sleep 3600