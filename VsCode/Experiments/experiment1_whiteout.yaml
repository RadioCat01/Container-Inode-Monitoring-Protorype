apiVersion: v1
kind: Pod
metadata:
  name: exp1-whiteout
  namespace: default
spec:
  containers:
  - name: ubuntu
    image: ubuntu:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Waiting 20 seconds for eBPF cgroup sync..."
      sleep 20
      echo "Deleting files from lowerdir to trigger OverlayFS whiteouts..."
      # Delete 5000 files from the base image
      ls -1 /usr/bin | head -n 5000 | xargs -I {} rm /usr/bin/{}
      echo "Done! Keeping pod alive for metrics collection."
      sleep 3600
