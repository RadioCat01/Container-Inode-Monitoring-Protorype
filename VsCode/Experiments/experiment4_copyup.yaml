apiVersion: v1
kind: Pod
metadata:
  name: exp4-copyup-test
  namespace: default
spec:
  containers:
  - name: ubuntu
    image: ubuntu:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Waking up cgroup discovery..."
      touch /tmp/warmup
      # Wait generously for the 5-15s refreshCgroupMap ticker to hit
      echo "Waiting 60s for kernel whitelisting..." 
      sleep 60
      echo "Running New Path Copy-Up Payload..."
      mkdir -p /root/testdir
            echo "Running Atomic Append Copy-Up Payload..."
      for f in $(ls -1 /etc/*.conf | head -n 500); do
        # Appending to an existing lowerdir file triggers the 
        # workdir optimization (creating hidden temp file, then vfs_link)
        echo "# modified" >> $f
      done
