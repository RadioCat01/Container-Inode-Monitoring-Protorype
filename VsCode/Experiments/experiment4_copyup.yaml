apiVersion: v1
kind: Pod
metadata:
  name: exp4-copyup-test
  namespace: default
spec:
  containers:
  - name: ubuntu
    image: ubuntu:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Waking up cgroup discovery..."
      touch /tmp/warmup
      # Wait generously for the 5-15s refreshCgroupMap ticker to hit
      echo "Waiting 60s for kernel whitelisting..." 
      sleep 60
      echo "Running actual research payload..."
      for f in $(ls -1 /etc | grep "\.conf$" | head -n 50); do
        echo "# modified" >> /etc/$f
      done
