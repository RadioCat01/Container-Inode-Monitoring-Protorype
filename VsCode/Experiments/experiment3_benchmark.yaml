apiVersion: v1
kind: Pod
metadata:
  name: exp3-benchmark
  namespace: default
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Waiting 20 seconds for eBPF cgroup sync..."
      sleep 20
      echo "Creating 30,000 files via 8 parallel workers..."
      mkdir -p /tmp/bench
      seq 1 30000 | xargs -n1 -P8 -I{} sh -c 'touch /tmp/bench/f_{}' 
      echo "Done! Keeping pod alive for metrics collection."
      sleep 3600
