apiVersion: v1
kind: Pod
metadata:
  name: exp3-benchmark-test
  namespace: default
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Waking up cgroup discovery..."
      touch /tmp/warmup
      echo "Waiting 60s for kernel whitelisting..." 
      sleep 60
      echo "Running Benchmark research payload (30k concurrent files)..."
      mkdir -p /tmp/bench
      seq 1 30000 | xargs -n1 -P8 -I{} sh -c 'touch /tmp/bench/f_{}' 
      echo "Done! Keeping pod alive for metrics collection."
      sleep 3600
