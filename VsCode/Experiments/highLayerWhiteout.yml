apiVersion: v1
kind: Pod
metadata:
  name: multi-layer-whiteout-test-pod
spec:
  restartPolicy: Never
  containers:
  - name: deep-whiteout-container
    image: radiocat2000/highlayerimage:v1
    imagePullPolicy: Always

    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Container started. Waiting 30s...";
        sleep 30;

        cd /test_data
        echo "Starting WHITEOUT workload...";

        for i in $(seq 1 1000); do
          rm file_$i
          sleep 0.005
        done

        echo "Whiteout workload done. Sleeping...";
        sleep 300;

    securityContext:
      privileged: true