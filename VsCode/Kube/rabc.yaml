apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-tracer-sa
  namespace: default 

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-tracer-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-tracer-binding
subjects:
- kind: ServiceAccount
  name: ebpf-tracer-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: ebpf-tracer-role
  apiGroup: rbac.authorization.k8s.io
