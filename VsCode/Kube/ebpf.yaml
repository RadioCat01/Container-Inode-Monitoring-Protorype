apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-tracer
  namespace: default
  labels:
    app: ebpf-tracer
spec:
  selector:
    matchLabels:
      app: ebpf-tracer
  template:
    metadata:
      labels:
        app: ebpf-tracer
        # for Prometheus PodMonitor selection
        app.kubernetes.io/name: ebpf-host-tracer-app 
    spec:
      serviceAccountName: ebpf-tracer-sa
      hostPID: true
      containers:
      - name: tracer
        image: radiocat2000/ebpf-tracer:v17
        imagePullPolicy: Always  
        securityContext:
          privileged: true
        ports:
        - containerPort: 9091
          name: metrics-port # PodMonitor will scrape this named port
        volumeMounts:
        - name: sysfs-cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        - name: tracefs
          mountPath: /sys/kernel/tracing
          readOnly: true
        - name: containerd-overlay
          mountPath: /var/snap/microk8s/common/var/lib/containerd
          readOnly: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumes:
      - name: sysfs-cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: tracefs 
        hostPath:
          path: /sys/kernel/tracing
          type: Directory
      - name: containerd-overlay
        hostPath:
          path: /var/snap/microk8s/common/var/lib/containerd
          type: Directory
      tolerations:
      - operator: Exists
